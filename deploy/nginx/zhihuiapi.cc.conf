# 郅绘网关：api.zhihuiapi.cc -> 业务 Node 服务，relay.zhihuiapi.cc -> new-api
#
# 放到 /etc/nginx/sites-available/zhihuiapi.cc.conf 并软链到 sites-enabled。
# HTTPS 由 certbot --nginx 自动补写（install.sh 已包含该步）。
#
# 注意：zhihuiapi.cc / www 仍留在帽子云静态托管，这里不要加，避免抢解析。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zhihui_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

upstream zhihui_newapi {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.zhihuiapi.cc;

    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://zhihui_app;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.zhihuiapi.cc;

    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # 大模型流式输出不能缓冲
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://zhihui_newapi;
    }
}
