# 郅绘中转站（new-api）单站入口
#
#   zhihuiapi.cc / www.zhihuiapi.cc  ->  new-api (127.0.0.1:3000)
#   relay.zhihuiapi.cc / api.zhihuiapi.cc  ->  301 到主域名
#
# 证书：/etc/letsencrypt/live/zhihuiapi.cc/（certbot --nginx 自动续期）
# 品牌静态资源：/opt/zhihui/deploy/branding/{logo.png,favicon.ico}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zhihuiapi_relay {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 所有 80 端口请求统一跳 HTTPS 主域名
server {
    listen 80;
    listen [::]:80;
    server_name zhihuiapi.cc www.zhihuiapi.cc relay.zhihuiapi.cc api.zhihuiapi.cc;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://zhihuiapi.cc$request_uri; }
}

# www 归一到裸域
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zhihuiapi.cc$request_uri;
}

# 旧域名统一跳转，避免硬编码的旧客户端报错
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.zhihuiapi.cc api.zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zhihuiapi.cc$request_uri;
}

# 主站：new-api
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256m;

    location = /logo.png {
        root /opt/zhihui/deploy/branding;
        access_log off;
        expires 7d;
    }

    location = /favicon.ico {
        root /opt/zhihui/deploy/branding;
        access_log off;
        expires 7d;
    }

    # 品牌与收款码等静态资源
    location /branding/ {
        alias /opt/zhihui/deploy/branding/;
        access_log off;
        expires 7d;
    }

    # 充值页（收款码 + 人工发码流程，TopUpLink 指向这里）
    location = /pay {
        root /opt/zhihui/deploy/branding;
        try_files /pay.html =404;
    }

    # 首页 HTML：需要开缓冲才能做子串替换（改写默认标题）
    location = / {
        proxy_pass http://zhihuiapi_relay;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<title>New API</title>' '<title>郅绘中转站 · AI 模型中转与统一接入</title>';
        sub_filter 'Unified AI API gateway and admin dashboard.' '郅绘中转站 · AI 模型统一接入、计费与用量日志。';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://zhihuiapi_relay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # 大模型流式输出不能缓冲
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
