# 郅绘画布站点 + new-api 中转站
#
#   zhihuiapi.cc / www  -> 郅绘创作台/画布（127.0.0.1:8787）
#   api.zhihuiapi.cc    -> 同一个郅绘后端（前端固定调用这个域名）
#   relay.zhihuiapi.cc  -> new-api 中转站（127.0.0.1:3000）
#
# 证书：/etc/letsencrypt/live/zhihuiapi.cc/（certbot 自动续期）
# 品牌/收款码静态资源：/opt/zhihui/deploy/branding

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream zhihui_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

upstream zhihuiapi_relay {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name zhihuiapi.cc www.zhihuiapi.cc relay.zhihuiapi.cc api.zhihuiapi.cc;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zhihuiapi.cc$request_uri;
}

# 主站：郅绘创作台 + 无限画布
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256m;

    location = /logo.png {
        root /opt/zhihui/deploy/branding;
        access_log off;
        expires 7d;
    }
    location = /favicon.ico {
        root /opt/zhihui/deploy/branding;
        access_log off;
        expires 7d;
    }
    location /branding/ {
        alias /opt/zhihui/deploy/branding/;
        access_log off;
        expires 7d;
    }
    location = /pay {
        root /opt/zhihui/deploy/branding;
        try_files /pay.html =404;
    }

    location / {
        proxy_pass http://zhihui_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# 郅绘后端接口域名（前端写死了这个地址）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256m;

    location / {
        proxy_pass http://zhihui_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

# new-api 中转站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.zhihuiapi.cc;

    ssl_certificate     /etc/letsencrypt/live/zhihuiapi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhihuiapi.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256m;

    # 首页 HTML 需要开缓冲才能改写标题
    location = / {
        proxy_pass http://zhihuiapi_relay;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<title>New API</title>' '<title>郅绘中转站 · AI 模型中转与统一接入</title>';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://zhihuiapi_relay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
