# 郅绘中转站：单机 new-api
#
# 服务器：阿里云杭州 47.114.52.219（Ubuntu 24.04）
# 入口：nginx 反代 127.0.0.1:3000，域名为 zhihuiapi.cc
# 数据：./newapi-data/one-api.db（SQLite，务必随卷备份）
#
# 常用命令：
#   docker compose ps                    查看状态
#   docker compose logs -f new-api       查看日志
#   docker compose up -d                 启动
#   docker compose pull && docker compose up -d   升级镜像
#
name: zhihui

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: zhihui-new-api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      # nginx 在宿主机上，容器看到的来源 IP 是宿主机网桥
      TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
    volumes:
      # SQLite 数据必须落盘，否则重启丢数据
      - ./newapi-data:/data
    ports:
      - "127.0.0.1:3000:3000"
