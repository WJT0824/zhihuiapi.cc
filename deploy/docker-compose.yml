# 郅绘：单机部署编排（业务 Node 服务 + new-api 中转站）
#
# 适用：一台 Ubuntu 22.04/24.04 云服务器（1 核 2G 起）。
# 密钥都放在同目录 .env 里（不进 Git），首次运行 install.sh 会自动生成。
#
# 启动：docker compose up -d --build
#
name: zhihui

services:
  zhihui:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zhihui-web:local
    container_name: zhihui-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
    volumes:
      - ./data:/app/data
    ports:
      # 只监听本机，由宿主 Nginx 反代并负责 HTTPS
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  new-api:
    image: calciumion/new-api:latest
    container_name: zhihui-new-api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      # Nginx 在宿主上，容器看到的来源 IP 是宿主机网桥
      TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12"
    volumes:
      # SQLite 数据必须落盘，否则重启丢数据
      - ./newapi-data:/data
    ports:
      - "127.0.0.1:3000:3000"
